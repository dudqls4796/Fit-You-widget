<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="아우터 실측 위치 안내 도식">
  <!-- 브랜드가 제공하는 실측 도식이 없을 때 쓰는 범용 대체 이미지.
       특정 상품/브랜드에서 가져온 것이 아니라 이 프로젝트에서 직접 그린 단순 개략도라
       저작권 문제 없음. 자켓 실루엣 + 실측표와 동일한 라벨(총장/어깨너비/가슴단면/소매길이) 콜아웃. -->
  <rect x="0" y="0" width="320" height="320" fill="none"/>

  <!-- 아주 단순한 자켓 실루엣 (앞면) -->
  <g fill="none" stroke="#8a8a8f" stroke-width="2.5" stroke-linejoin="round">
    <path d="
      M 130 55
      C 130 40, 190 40, 190 55
      L 205 70
      L 235 95
      L 220 140
      L 205 128
      L 205 260
      L 115 260
      L 115 128
      L 100 140
      L 85 95
      L 115 70
      Z" />
    <!-- 목/카라 -->
    <path d="M 138 55 C 145 68, 175 68, 182 55" />
    <!-- 앞 중심 지퍼 라인 -->
    <line x1="160" y1="70" x2="160" y2="258" stroke-dasharray="4 4" />
  </g>

  <!-- 1. 총장 (전체 길이, 왼쪽 세로) -->
  <line x1="70" y1="55" x2="70" y2="260" stroke="#2f6feb" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="42" y="148" width="30" height="20" rx="4" fill="#2f6feb"/>
  <text x="57" y="162" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">총장</text>

  <!-- 2. 어깨너비 (어깨 폭, 위쪽 가로) -->
  <line x1="100" y1="72" x2="220" y2="72" stroke="#2f6feb" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="128" y="40" width="64" height="20" rx="4" fill="#2f6feb"/>
  <text x="160" y="54" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">어깨너비</text>

  <!-- 3. 가슴단면 (가슴 폭, 중간 가로) -->
  <line x1="115" y1="150" x2="205" y2="150" stroke="#2f6feb" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="128" y="158" width="64" height="20" rx="4" fill="#2f6feb"/>
  <text x="160" y="172" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">가슴단면</text>

  <!-- 4. 소매길이 (소매 대각선) -->
  <line x1="220" y1="90" x2="222" y2="138" stroke="#2f6feb" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="234" y="105" width="64" height="20" rx="4" fill="#2f6feb"/>
  <text x="266" y="119" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">소매길이</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f6feb"/>
    </marker>
  </defs>

  <text x="160" y="300" font-family="sans-serif" font-size="11" fill="#8a8a8f" text-anchor="middle">측정 위치 예시 (일반 아우터 기준 개략도)</text>
</svg>
