<!doctype html>
<!--
  popup.html — 확장 아이콘을 눌렀을 때 뜨는 팝업 화면.
  "최근 본 상품" 목록을 보여주며, 목록 내용은 popup.js가 storage에서 읽어 채운다.
  스타일은 popup.css. (manifest.json의 action.default_popup에 연결됨)
-->
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>최근 본 상품</title>
    <link rel="stylesheet" href="popup.css">
    <!-- defer: DOM이 준비된 뒤 실행되어 #recentProducts 등을 바로 찾을 수 있다 -->
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="popup">
      <h1>최근 본 상품</h1>
      <!-- 목록이 비어 있을 때만 보이는 안내 문구(popup.js가 hidden 토글) -->
      <p id="emptyState" class="empty" hidden>아직 본 상품이 없어요</p>
      <!-- 최근 본 상품 버튼들이 동적으로 추가되는 목록 -->
      <ul id="recentProducts" class="products" aria-label="최근 본 상품 목록"></ul>
    </main>
  </body>
</html>
